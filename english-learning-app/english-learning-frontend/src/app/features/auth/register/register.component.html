<div class="auth-wrapper">
  <div class="auth-card">

    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-subtitle">Bắt đầu miễn phí — không cần thẻ tín dụng.</p>

    <!-- TAB TOGGLE -->
    <div class="tab-toggle">
      <button class="tab-btn" [routerLink]="['/login']" [queryParams]="{ returnUrl: returnUrl }">Đăng nhập</button>
      <button class="tab-btn active">Đăng ký</button>
    </div>

    <!-- GOOGLE BUTTON -->
    <button class="google-btn" (click)="continueWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Tiếp tục với Google
    </button>

    <div class="divider"><span>hoặc</span></div>

    <!-- REGISTER FORM -->
    <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="auth-form">

      <div class="form-group">
        <label class="form-label">Họ và tên</label>
        <input
          type="text"
          class="form-input"
          placeholder="Nguyễn Văn An"
          [(ngModel)]="registerData.fullName"
          name="fullName"
          required />
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-input"
          placeholder="ban@example.com"
          [(ngModel)]="registerData.email"
          name="email"
          required />
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-input has-icon"
            placeholder="Tối thiểu 8 ký tự"
            [(ngModel)]="registerData.password"
            name="password"
            required
            minlength="8" />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Xác nhận mật khẩu</label>
        <div class="input-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-input has-icon"
            placeholder="Nhập lại mật khẩu"
            [(ngModel)]="registerData.confirmPassword"
            name="confirmPassword"
            required />
          <button type="button" class="eye-btn" (click)="toggleConfirmPassword()">
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <p class="terms-text">
        Bằng cách đăng ký, bạn đồng ý với
        <a href="#" class="link">Điều khoản dịch vụ</a> và
        <a href="#" class="link">Chính sách bảo mật</a> của chúng tôi.
      </p>

      <button type="submit" class="submit-btn">
        Đăng ký <span class="arrow">›</span>
      </button>

      <p class="switch-text">
        Đã có tài khoản? <a [routerLink]="['/login']" [queryParams]="{ returnUrl: returnUrl }" class="link">Đăng nhập ngay</a>
      </p>

    </form>
  </div>
</div>
