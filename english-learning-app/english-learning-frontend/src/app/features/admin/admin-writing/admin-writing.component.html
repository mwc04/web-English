<div class="admin-page">
  <div class="page-header">
    <h1>Quản lý Bài Writing</h1>
    <button class="btn btn-primary" (click)="openAdd()">+ Thêm mới</button>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Tìm kiếm bài writing..." [(ngModel)]="searchQuery" (input)="applyFilter()" />
  </div>

  <table class="admin-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Tiêu đề</th>
        <th>Chủ đề</th>
        <th>Ngày tạo</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filteredItems">
        <td>{{ item.title }}</td>
        <td>{{ item.topic }}</td>
        <td>{{ item.createdAt | date:'dd/MM/yyyy' }}</td>
        <td class="actions">
          <button class="btn-icon edit" (click)="openEdit(item)" title="Sửa">✏️</button>
          <button class="btn-icon delete" (click)="deleteItem(item._id)" title="Xóa">🗑️</button>
        </td>
      </tr>
      <tr *ngIf="filteredItems.length === 0">
        <td colspan="4" class="text-center">Không có dữ liệu</td>
      </tr>
    </tbody>
  </table>

  <div class="loading" *ngIf="loading">Đang tải...</div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal = false">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ editItem ? 'Sửa bài writing' : 'Thêm bài writing' }}</h2>
    <div class="form-group">
      <label>Tiêu đề</label>
      <input type="text" [(ngModel)]="formData.title" />
    </div>
    <div class="form-group">
      <label>Chủ đề</label>
      <input type="text" [(ngModel)]="formData.topic" />
    </div>
    <div class="form-group">
      <label>Bài mẫu</label>
      <textarea [(ngModel)]="formData.sample_answer" rows="4"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" (click)="showModal = false">Hủy</button>
      <button class="btn btn-primary" (click)="save()">Lưu</button>
    </div>
  </div>
</div>
