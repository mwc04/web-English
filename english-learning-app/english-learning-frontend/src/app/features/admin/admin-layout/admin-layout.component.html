<div class="admin-container">
  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <h2 class="sidebar-logo" (click)="goToHome()">⚙️ Admin</h2>
      <button class="toggle-btn" (click)="toggleSidebar()">☰</button>
    </div>
    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         [class.collapsed]="sidebarCollapsed"
         class="nav-item">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item home-btn" (click)="goToHome()">
        <span class="nav-icon">🏠</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Về trang chủ</span>
      </button>
      <button class="nav-item logout-btn" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Đăng xuất</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="admin-main">
    <router-outlet />
  </main>
</div>
