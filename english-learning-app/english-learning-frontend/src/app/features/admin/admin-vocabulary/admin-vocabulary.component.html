<div class="admin-page">
  <div class="page-header">
    <h1>Quản lý Từ vựng</h1>
    <button class="btn btn-primary" (click)="openAdd()">+ Thêm mới</button>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="Tìm kiếm từ vựng..." [(ngModel)]="searchQuery" (input)="applyFilter()" />
    <select [(ngModel)]="categoryFilter" (change)="applyFilter()">
      <option value="">Tất cả danh mục</option>
      <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
    </select>
  </div>

  <table class="admin-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>Từ</th>
        <th>Nghĩa</th>
        <th>Danh mục</th>
        <th>Ví dụ</th>
        <th>Ngày tạo</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filteredItems">
        <td><strong>{{ item.word }}</strong></td>
        <td>{{ item.meaning }}</td>
        <td><span class="category-badge">{{ item.category || 'General' }}</span></td>
        <td class="text-muted">{{ item.example || '—' }}</td>
        <td>{{ item.createdAt | date:'dd/MM/yyyy' }}</td>
        <td class="actions">
          <button class="btn-icon edit" (click)="openEdit(item)" title="Sửa">✏️</button>
          <button class="btn-icon delete" (click)="deleteItem(item._id)" title="Xóa">🗑️</button>
        </td>
      </tr>
      <tr *ngIf="filteredItems.length === 0">
        <td colspan="6" class="text-center">Không có dữ liệu</td>
      </tr>
    </tbody>
  </table>

  <div class="loading" *ngIf="loading">Đang tải...</div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="showModal = false">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ editItem ? 'Sửa từ vựng' : 'Thêm từ vựng' }}</h2>
    <div class="form-group">
      <label>Từ (English)</label>
      <input type="text" [(ngModel)]="formData.word" />
    </div>
    <div class="form-group">
      <label>Nghĩa (Tiếng Việt)</label>
      <input type="text" [(ngModel)]="formData.meaning" />
    </div>
    <div class="form-group">
      <label>Danh mục</label>
      <select [(ngModel)]="formData.category">
        <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      </select>
    </div>
    <div class="form-group">
      <label>Ví dụ</label>
      <textarea [(ngModel)]="formData.example" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" (click)="showModal = false">Hủy</button>
      <button class="btn btn-primary" (click)="save()">Lưu</button>
    </div>
  </div>
</div>
