<!-- TOP NAV -->
<nav class="topnav">
  <button class="topnav-back" (click)="goBack()">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
  </button>
  <div>
    <div class="topnav-title">{{ videoTitle }}</div>
    <div class="topnav-sub">Luyện phát âm qua Shadowing</div>
  </div>
  <div class="topnav-spacer"></div>
  <span class="topnav-mode-badge">🎤 BẮT CHƯỚC PHÁT ÂM</span>
</nav>

<!-- MAIN -->
<div class="lesson-layout">

  <!-- LEFT -->
  <div class="left-panel">

    <!-- VIDEO -->
    <div class="video-box">
      <div class="video-frame" (click)="togglePlay()">
        <div class="scene">🎬</div>
        <button class="play-btn-big" (click)="togglePlay(); $event.stopPropagation()">
          <svg width="24" height="24" fill="#1a1a2e" viewBox="0 0 24 24">
            <path *ngIf="!isPlaying" d="M8 5v14l11-7z"/>
            <path *ngIf="isPlaying" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
      </div>

      <div class="video-header">
        <div class="video-avatar">🏫</div>
        <div class="video-info">
          <div class="vtitle">{{ videoTitle }}</div>
          <div class="vsub">Shadowing Practice</div>
        </div>
      </div>
      <div class="video-controls-top">
        <button class="vc-btn" title="Âm thanh">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M12 6v12m-3.536-9.536a5 5 0 000 7.072"/>
          </svg>
        </button>
        <button class="vc-btn" title="Phụ đề">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2" stroke-width="2"/>
            <path stroke-linecap="round" d="M6 10h8M6 14h5"/>
          </svg>
        </button>
        <button class="vc-btn" title="Cài đặt">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="video-bottom">
        <div class="progress-bar-wrap" (click)="seekVideo($event)">
          <div class="progress-fill" [style.width.%]="progress">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <div class="video-bottom-row">
          <span class="vb-time">{{ currentTime }}</span>
          <button class="link-btn" title="Sao chép link">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
          </button>
          <div class="yt-logo">
            <svg height="14" viewBox="0 0 90 20" fill="white" xmlns="http://www.w3.org/2000/svg">
              <path d="M27.9727 3.12324C27.6435 1.89323 26.6768 0.926623 25.4468 0.597366C23.2197 2.24288e-07 14.285 0 14.285 0C14.285 0 5.35042 2.24288e-07 3.12323 0.597366C1.89323 0.926623 0.926623 1.89323 0.597366 3.12324C2.24288e-07 5.35042 0 10 0 10C0 10 2.24288e-07 14.6496 0.597366 16.8768C0.926623 18.1068 1.89323 19.0734 3.12323 19.4026C5.35042 20 14.285 20 14.285 20C14.285 20 23.2197 20 25.4468 19.4026C26.6768 19.0734 27.6435 18.1068 27.9727 16.8768C28.5701 14.6496 28.5701 10 28.5701 10C28.5701 10 28.5677 5.35042 27.9727 3.12324Z" fill="#FF0000"/>
              <path d="M11.4253 14.2854L18.8477 10.0004L11.4253 5.71533V14.2854Z" fill="white"/>
              <text x="33" y="15" font-family="Arial" font-size="12" font-weight="bold" fill="white">YouTube</text>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-panel">
      <div class="controls-top">
        <div class="toggle-group">
          <label class="toggle-row">
            <div class="toggle">
              <input type="checkbox" [(ngModel)]="autoStop"/>
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </div>
            <span class="toggle-label">Tự động dừng</span>
          </label>
          <label class="toggle-row">
            <div class="toggle">
              <input type="checkbox" [(ngModel)]="bigVideo"/>
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </div>
            <span class="toggle-label">Video kích thước lớn</span>
          </label>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div class="playback-btns">
            <button class="pb-btn" title="Câu trước" (click)="prevSentence()">
              <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
              </svg>
            </button>
            <button class="pb-btn" title="Lặp lại" (click)="replaySentence()">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
            </button>
            <button class="pb-btn play" title="Phát/Dừng" (click)="togglePlay()">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path *ngIf="!isPlaying" d="M8 5v14l11-7z"/>
                <path *ngIf="isPlaying" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>
            <button class="pb-btn" title="Câu tiếp" (click)="nextSentence()">
              <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>
          </div>
          <div class="controls-right">
            <button class="speed-badge" (click)="cycleSpeed()">⚡ <span>{{ speeds[speedIndex] }}x</span></button>
            <button class="pb-btn" title="Toàn màn hình">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- SENTENCE WORDS -->
      <div class="sentence-display">
        <div class="sentence-words">
          <div class="word-item" *ngFor="let w of currentWords">
            <span class="word-text">{{ w.word }}</span>
            <span class="word-ipa">{{ w.ipa }}</span>
          </div>
        </div>
      </div>

      <!-- RECORD BUTTONS -->
      <div class="record-row">
        <button class="btn-replay" id="replayBtn" (click)="replayRecording()">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>
          </svg>
          PHÁT LẠI GHI ÂM
        </button>
        <button class="btn-record" [class.recording]="isRecording" (click)="toggleRecord()">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
          </svg>
          <span>{{ isRecording ? 'DỪNG GHI' : 'GHI ÂM' }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: TRANSCRIPT -->
  <div class="right-panel">
    <div class="transcript-header">
      <button class="tab-btn" [class.active]="activeTab==='transcript'" (click)="switchTab('transcript')">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        BẢN CHÉP
      </button>
      <button class="tab-btn" [class.active]="activeTab==='ipa'" (click)="switchTab('ipa')">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4"/>
        </svg>
        IPA
      </button>
      <button class="tab-btn" [class.active]="activeTab==='trans'" (click)="switchTab('trans')">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
        </svg>
        Trans
      </button>
      <span class="progress-label">{{ progress }}%</span>
    </div>
    <div class="transcript-list">
      <div
        class="t-card"
        *ngFor="let s of sentences"
        [class.active]="s.id === currentSentence"
        (click)="selectSentence(s.id)"
        [id]="'tc-' + s.id"
      >
        <div class="t-card-header">
          <span class="t-num">#{{ s.id }}</span>
          <div class="t-card-actions">
            <button class="t-action-btn" title="Chỉnh sửa" (click)="$event.stopPropagation()">
              <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button class="t-action-btn" title="Báo lỗi" (click)="$event.stopPropagation()">
              <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="t-en">{{ s.en }}</div>
        <div class="t-vi">{{ s.vi }}</div>
      </div>
    </div>
  </div>

</div>
